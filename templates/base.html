{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}{{ SITE_INSTITUTION }} — {{ SITE_NAME }}, plateforme de gestion des cabinets d'avocats{% endblock %}">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ STATIC_VERSION }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">{% translate "Aller au contenu" %}</a>
  {% block body %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <div class="toast-region" data-toast-region aria-live="polite" aria-relevant="additions"></div>
  <script type="module" src="{% static 'js/main.js' %}?v={{ STATIC_VERSION }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
