<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Procuration {{ document_number }}</title>
  <style>
    @page { size: A4; margin: 22mm 20mm 24mm; }
    body {
      font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
      font-size: 14pt;
      line-height: 1.45;
      color: #111;
    }
    .title {
      text-align: center;
      font-weight: 700;
      font-size: 14pt;
      letter-spacing: 0.12em;
      margin: 0 0 6px;
    }
    .number {
      text-align: center;
      font-size: 14pt;
      margin: 0 0 10px;
    }
    .rule {
      border: 0;
      border-top: 2px double #111;
      margin: 0 0 18px;
    }
    p {
      margin: 0 0 10px;
      text-align: justify;
      overflow-wrap: anywhere;
      word-wrap: break-word;
      max-width: 100%;
    }
    .indent { text-indent: 1.5em; }
    strong, b { font-weight: 700; }
    em, i { font-style: italic; }
    u { text-decoration: underline; }
    .block { margin: 14px 0; }
    .sign {
      margin-top: 36px;
      text-align: right;
      page-break-inside: avoid;
    }
    .sign p { text-align: right; margin: 0 0 4px; font-size: 14pt; }
    .sign .name { font-weight: 700; margin-top: 28px; }
    .footer {
      margin-top: 40px;
      font-size: 11pt;
      color: #333;
      line-height: 1.35;
    }
    .footer p { margin: 0; text-align: left; }
  </style>
</head>
<body>
  {% if draft_body %}
  {{ draft_body|safe }}
  {% else %}
  {% include "procurations/pdf/procuration_body.html" %}
  {% endif %}
</body>
</html>
